services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: fasal, POSTGRES_PASSWORD: fasal, POSTGRES_DB: fasal }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasal -d fasal"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fasal:fasal@db:5432/fasal
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
volumes:
  pgdata:
