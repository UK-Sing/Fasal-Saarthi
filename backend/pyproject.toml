[project]
name = "fasal-sarthi-api"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "ortools>=9.10",
  "pyyaml>=6",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "firebase-admin>=7.7.0",
]
[dependency-groups]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["."]
